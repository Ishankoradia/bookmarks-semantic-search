name: Mobile Release (draft)

# Manual mobile release: bump the app version, commit it, then trigger an EAS
# production build that auto-submits to the store as a DRAFT (add release notes
# in the store console before rolling out).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (app.json expo.version)'
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
      platform:
        description: 'Platform to build'
        type: choice
        required: true
        default: android
        options: [android, ios, all]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Bump app.json version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("app.json"));
            const [maj, min, pat] = j.expo.version.split(".").map(Number);
            const t = process.env.BUMP;
            const v = t === "major" ? [maj + 1, 0, 0]
                    : t === "minor" ? [maj, min + 1, 0]
                    : [maj, min, pat + 1];
            j.expo.version = v.join(".");
            fs.writeFileSync("app.json", JSON.stringify(j, null, 2) + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + j.expo.version + "\n");
          '

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(mobile): bump version to ${{ steps.bump.outputs.version }}"
          git push

      - name: Install dependencies
        # eas build resolves app.json config plugins (expo-secure-store, etc.)
        # locally before uploading, so node_modules must be present.
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS build + auto-submit (draft)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ${{ inputs.platform }} --profile production --auto-submit --non-interactive

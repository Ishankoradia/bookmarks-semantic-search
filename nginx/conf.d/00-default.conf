# Catch-all: drop any request whose Host/SNI doesn't match a site below.
# Loaded first (00- prefix) and marked default_server, so only the explicitly
# declared domains in the other *.conf files are actually served.

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # Any valid origin cert works here — it only needs to complete the TLS
    # handshake before nginx closes the connection with 444.
    ssl_certificate     /etc/nginx/certs/ishankoradia.in.pem;
    ssl_certificate_key /etc/nginx/certs/ishankoradia.in.key;

    return 444;
}

services:
  nginx:
    image: nginx:alpine
    container_name: bookmark-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Server config — edit conf.d/default.conf, then `docker compose restart nginx`
      - ./conf.d:/etc/nginx/conf.d:ro
      # Cloudflare Origin CA certificate + key (not committed — see certs/README.md)
      - ./certs:/etc/nginx/certs:ro
    networks:
      - bookmark-network
    restart: unless-stopped

networks:
  # Shared with docker-compose.web.yml (backend + frontend). Created by that stack;
  # the name is "<project>_<network>" = repo dir "bookmarks-semantic-search".
  bookmark-network:
    external: true
    name: bookmarks-semantic-search_bookmark-network
